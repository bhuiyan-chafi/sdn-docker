# =============================================================
# Project Lab — Phase 4: + PC1 and PC2 under lswitch1 (VLAN 100/200)
# =============================================================

# --- ONOS SDN Controller ---
# Custom image that bundles ONOS on top of kathara/core
onosnode[image]="kathara/onos-b5g"
# Expose the ONOS Web UI (port 8181) to the host machine
onosnode[bridged]=true
onosnode[port]="8181:8181/tcp"
# Control plane link: Domain A (131.114.54.0/24)
onosnode[0]="A"

# --- Parent Switch ---
# OVS switch that acts as the SDN-controlled gateway
parentswitch[image]="kathara/sdn"
# Control plane link: Domain A — ONOS will discover it here
parentswitch[0]="A"
# Data plane link: Domain B — uplink to lswitch1 (192.168.1.0/24)
parentswitch[1]="B"
# Data plane link: Domain C — uplink to lswitch2 (192.168.2.0/24)
parentswitch[2]="C"

# --- Local Switch 1 ---
# OVS switch connected to parentswitch via Domain B
lswitch1[image]="kathara/sdn"
# Control plane link: Domain A — ONOS will discover it here
lswitch1[0]="A"
# Data plane link: Domain B — downlink to parentswitch (192.168.1.0/24)
lswitch1[1]="B"
# Host access ports (VLAN 100 and VLAN 200)
lswitch1[2]="D"   # pc1 — vlan 100
lswitch1[3]="E"   # pc2 — vlan 200

# --- PC1 (vlan 100, 10.10.1.2) ---
pc1[0]="D"

# --- PC2 (vlan 200, 10.10.1.3) ---
pc2[0]="E"

# --- Local Switch 2 ---
# OVS switch connected to parentswitch via Domain C
lswitch2[image]="kathara/sdn"
# Control plane link: Domain A — ONOS will discover it here
lswitch2[0]="A"
# Data plane link: Domain C — downlink to parentswitch (192.168.2.0/24)
lswitch2[1]="C"
# Host access ports (untagged)
lswitch2[2]="F"   # pc3
lswitch2[3]="G"   # pc4

# --- PC3 (10.10.2.4) ---
pc3[0]="F"

# --- PC4 (10.10.2.5) ---
pc4[0]="G"
